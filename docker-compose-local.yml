services:
  mongo:
    image: mongo:8.0
    restart: always
    ports:
      - "27017:27017"
    command: >
      bash -c "
        mongod --port 27017 --replSet rs0 --bind_ip_all &
        MONGO_PID=$! &&
        sleep 5 &&
        mongosh --port 27017 --eval 'rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]})' &&
        wait $MONGO_PID
      "
    networks:
      - local-network

networks:
  local-network:
    driver: bridge
